name = "jshaw-dev-backend"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serves the backend from app.jsh4w.dev once the domain is added to Cloudflare.
# Comment this out until the DNS record exists, or the first deploy will fail.
# [[routes]]
# pattern = "app.jsh4w.dev"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "jshaw"

database_id = "1d8f16f3-9c3d-423c-b0ca-d9550b9e0559"

[vars]
SITE_URL = "https://jsh4w.dev"
# Zero Trust team domain, e.g. "jsh4w.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "curly-wind-fe5d.cloudflareaccess.com"
# The Access application's Audience (AUD) tag, from its Overview tab.
ACCESS_AUD = "12b135b12b06dd58ff1924266b6c4bf3d30aa5df0a778b6e427e564a4570d6ff"
# Vercel account slug, used to build dashboard links.
VERCEL_SLUG = "jsh4ws-projects"

# No secrets are needed yet. Cloudflare Access handles logging in, and the
# calendar source has not been chosen. Set any future ones with:
#   npx wrangler secret put <NAME>
