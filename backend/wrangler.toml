name = "jshaw-dev-backend"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serves the backend from app.jsh4w.dev once the domain is added to Cloudflare.
# Comment this out until the DNS record exists, or the first deploy will fail.
# [[routes]]
# pattern = "app.jsh4w.dev"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "jshaw"

database_id = "1d8f16f3-9c3d-423c-b0ca-d9550b9e0559"

[vars]
SITE_URL = "https://jsh4w.dev"
# Vercel account slug, used to build dashboard links.
VERCEL_SLUG = "jsh4ws-projects"
# GitHub usernames allowed to log in. Comma-separated; empty lets nobody in.
ALLOWED_GITHUB_USERS = "JSh4w"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET  from the GitHub OAuth app
#   SESSION_SECRET                          any long random string
